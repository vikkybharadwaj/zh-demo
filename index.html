<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bulk on AUTH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: a presenter column beside one iPhone-sized device. The device is a fixed light UI (AUTH's white sheet); only the page around it follows the viewer's theme. */
:root{
  --pg:#EEF1F0; --pg-fg:#17201D; --pg-mute:#56635E; --pg-line:#D5DBD8; --pg-card:#FFFFFF;
  --bezel:#0C0F0E;
  --ink:#1C1C1C; --mint:#D5FDD3; --ok:#3E9E6A; --oktxt:#1F6B43;
  --g1:#F5F5F5; --g2:#E4E4E4; --g3:#6B6B6B;
  --warnbg:#FFF3DC; --warn:#7A4A00; --errbg:#FDECEA; --err:#A8231B; --infobg:#E8F0FF; --info:#1D4F9E;
  --display:'Manrope',-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif;
  --body:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#0F1412;--pg-fg:#E6EEEA;--pg-mute:#9AA9A3;--pg-line:#26302C;--pg-card:#171E1B;color-scheme:dark}}
:root[data-theme="dark"]{--pg:#0F1412;--pg-fg:#E6EEEA;--pg-mute:#9AA9A3;--pg-line:#26302C;--pg-card:#171E1B;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--pg);color:var(--pg-fg);font-family:var(--body);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{display:flex;justify-content:center}

.phone{--w:390px;position:relative;width:var(--w);height:min(844px,calc(100dvh - 40px));min-height:640px;background:#fff;color:var(--ink);border-radius:46px;border:9px solid var(--bezel);overflow:hidden;display:flex;flex-direction:column;font-family:var(--body);font-size:15px;-webkit-user-select:none;user-select:none;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);isolation:isolate}
.status{height:34px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 4px;font-size:13px;font-weight:600;background:#fff}
.strip{flex:none;background:#fff;border-bottom:1px solid var(--g2);padding:6px 10px 8px;display:grid;gap:6px;touch-action:pan-y}
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;background:var(--g1);padding:3px;border-radius:12px}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;padding:5px 0 5px;display:grid;gap:0;justify-items:center;font-family:var(--body);color:var(--g3);cursor:pointer;min-width:0}
.seg button b{font-family:var(--display);font-size:13px;font-weight:800;line-height:1.1}
.seg button span{font-size:9.5px;font-weight:600;line-height:1.2;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--ink);color:#fff}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #1D4F9E;outline-offset:2px}

.app{position:relative;flex:1;min-height:0;background:var(--g1);overflow:hidden}
.host{height:100%;overflow:auto;padding:16px 16px 12px;display:flex;flex-direction:column;gap:14px}
.hh{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:17px;touch-action:none}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;font-style:normal;display:grid;place-items:center;font-size:14px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-weight:700;font-size:12px}
.card{background:#fff;border-radius:12px;padding:16px}
.big{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.muted{color:var(--g3)}
.small{font-size:12.5px;line-height:1.45}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.h2{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.2;margin:0;text-wrap:balance}
.h1{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
.btn{appearance:none;border:0;width:100%;min-height:50px;border-radius:8px;background:var(--ink);color:#fff;font:700 16px var(--body);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn[disabled]{background:var(--g2);color:var(--g3);cursor:not-allowed}
.btn.out{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{min-height:40px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);text-decoration:underline;min-height:40px;font-size:14px}
.banner{width:100%;border:0;text-align:left;font-family:var(--body);cursor:pointer;display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px}
.banner small{display:block;font-weight:500;opacity:.8;font-size:12px}
.found{background:var(--mint);border-radius:12px;padding:18px;display:grid;gap:12px}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sc div{background:#fff;border-radius:10px;padding:8px 4px;text-align:center}
.sc b{display:block;font-family:var(--display);font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.sc span{display:block;font-size:9.5px;line-height:1.2;color:var(--g3);margin-top:2px}
.hold-row{display:flex;justify-content:space-between;font-size:14px;padding:9px 0;border-top:1px solid var(--g1)}
.hold-row:first-of-type{border-top:0}
.foot{margin:6px 0 0;text-align:center;font-size:10.5px;color:var(--g3)}

.sheet{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .38s cubic-bezier(.2,.8,.2,1);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.15);z-index:5}
.sheet.open{transform:none}
.tb{flex:none;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.ib{appearance:none;border:0;background:transparent;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);cursor:pointer}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--g2);transition:width .2s}
.dots i.on{width:18px;background:var(--ink)}
.sb{flex:1;min-height:0;overflow:auto;padding:6px 20px 16px;display:flex;flex-direction:column;gap:14px}
.sf{flex:none;padding:8px 20px 12px;border-top:1px solid transparent;background:#fff;display:grid;gap:6px}
.counter{align-self:flex-start;background:var(--g1);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700}
.circle{width:72px;height:72px;border-radius:50%;background:var(--mint);display:grid;place-items:center;margin:4px auto 0}
.circle.ok svg{color:var(--ok)}
.center{text-align:center}
.greycard{background:var(--g1);border-radius:12px;padding:16px;display:grid;gap:10px}
.badges{display:flex;align-items:center;justify-content:center;gap:8px}
.badge{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--g2);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.45;cursor:pointer}
.chk input{appearance:none;flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--g3);background:#fff;display:grid;place-items:center;margin:0;cursor:pointer}
.chk input:checked{background:var(--ink);border-color:var(--ink)}
.chk input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.lnk{appearance:none;border:0;background:none;padding:0;font:inherit;text-decoration:underline;color:inherit;cursor:pointer}
.search{display:flex;align-items:center;gap:8px;background:var(--g1);border-radius:99px;padding:0 14px;height:42px}
.search input{flex:1;border:0;background:transparent;font:15px var(--body);min-width:0;height:100%;outline-offset:6px;user-select:text;-webkit-user-select:text}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--g2);background:#fff;border-radius:99px;padding:7px 13px;font:600 13px var(--body);cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"],.chip.sel{background:var(--mint);border-color:var(--ok)}
.chip small{color:var(--g3);font-weight:600;margin-left:3px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{appearance:none;background:#fff;border:1px solid var(--g2);border-radius:12px;padding:12px 4px 10px;display:grid;gap:7px;justify-items:center;font:600 12px var(--body);color:var(--ink);cursor:pointer;position:relative;min-width:0}
.tile .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.tile.dim{color:var(--g3)}
.mono{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;color:var(--ink)}
.tag2{position:absolute;top:5px;right:5px;font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--infobg);color:var(--info);border-radius:5px;padding:2px 5px}
.secure{background:#fff;border:1px solid var(--g2);box-shadow:0 8px 24px rgba(0,0,0,.1);border-radius:16px;padding:12px;display:grid;gap:10px;margin-top:auto;position:sticky;bottom:0}
.secure .t{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.note{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45;display:flex;gap:10px}
.note.warn{background:var(--warnbg);color:var(--warn)}
.note.err{background:var(--errbg);color:var(--err)}
.note.info{background:var(--infobg);color:var(--info)}
.note.ok{background:var(--mint);color:#17402A}
.note svg{flex:none;margin-top:1px}
.note b{display:block;margin-bottom:2px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:auto}
.keypad button{appearance:none;border:0;background:transparent;height:46px;font:600 22px var(--display);cursor:pointer;border-radius:10px;color:var(--ink)}
.keypad button:active{background:var(--g1)}
.amt{font-family:var(--display);font-weight:800;font-size:54px;letter-spacing:-.03em;text-align:center;font-variant-numeric:tabular-nums;line-height:1.05}
.coinline{color:var(--oktxt);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px}
.pcts{display:flex;justify-content:center;gap:8px}
.rcpt{border:1px solid var(--g2);border-radius:12px;overflow:hidden}
.rcpt .top{background:var(--g1);padding:14px 16px;text-align:center}
.rcpt .top b{display:block;font-family:var(--display);font-size:26px;font-weight:800}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 16px;font-size:13.5px;border-top:1px solid var(--g1)}
.kv span:first-child{color:var(--g3);flex:none}
.kv span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere;font-weight:600}
.kv button{appearance:none;border:0;background:none;cursor:pointer;vertical-align:middle;padding:2px;color:var(--ink)}
.grp{padding:10px 16px 4px;display:flex;justify-content:space-between;align-items:center;background:#fff;border-top:1px solid var(--g2);font-family:var(--display);font-weight:800;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 9px 3px 7px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--g1);color:#333;border:1px solid var(--g2)}
.p-credited{background:var(--mint);color:#17402A;border-color:#A9E3A6}
.p-confirming,.p-submitted,.p-match,.p-twofa{background:var(--infobg);color:var(--info);border-color:#C4D7F7}
.p-scheduled,.p-pending,.p-capped,.p-held,.p-slow{background:var(--warnbg);color:var(--warn);border-color:#F0D9A6}
.p-failed,.p-code,.p-balance,.p-looking{background:var(--errbg);color:var(--err);border-color:#F3C2BE}
.spin{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sec{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--g3);display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.item{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border:1px solid var(--g2);border-radius:12px}
.item.off{background:var(--g1);color:var(--g3)}
.item .nm{font-weight:700;font-size:14.5px}
.item .sub{font-size:12px;color:var(--g3);line-height:1.4}
.item .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;flex:none}
.cb{appearance:none;flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--g3);background:#fff;margin:0;display:grid;place-items:center;cursor:pointer}
.cb:checked{background:var(--ink);border-color:var(--ink)}
.cb:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cb:disabled{background:var(--g2);border-color:var(--g2);cursor:not-allowed}
.sw{appearance:none;flex:none;width:46px;height:28px;border-radius:99px;background:var(--g2);position:relative;cursor:pointer;margin:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.sw:checked{background:var(--ok)}
.sw:checked::after{left:21px}
.code{display:flex;gap:8px;justify-content:center}
.code i{width:44px;height:54px;border:1.5px solid var(--g2);border-radius:10px;display:grid;place-items:center;font:800 24px var(--display);font-style:normal}
.code.err i{border-color:var(--err)}
.autofill{align-self:center;appearance:none;border:0;background:var(--g1);border-radius:10px;padding:10px 16px;font:600 14px var(--body);cursor:pointer;display:flex;gap:8px;align-items:center}
.autofill small{color:var(--g3);font-weight:500}
.prog{display:flex;gap:3px;margin-top:6px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--g2)}
.prog i.on{background:var(--ok)}
.bar{height:8px;background:var(--g2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .6s}
.slide{position:relative;height:56px;border-radius:99px;background:var(--g1);border:1px solid var(--g2);display:grid;place-items:center;overflow:hidden;touch-action:none}
.slide span{font-weight:700;font-size:15px;color:var(--g3);pointer-events:none}
.knob{position:absolute;left:4px;top:4px;width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;cursor:grab;touch-action:none}
.slide.off{opacity:.45;pointer-events:none}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--mint)}
.sold{text-decoration:line-through;color:var(--g3)}
.lbl{font-size:11.5px;font-weight:700;color:var(--g3)}
.tabular{font-variant-numeric:tabular-nums}

.modal{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;animation:fade .2s}
.modal.mid{align-items:center;padding:24px}
.msheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px 20px 16px;display:grid;gap:12px;max-height:88%;overflow:auto;animation:up .3s cubic-bezier(.2,.8,.2,1)}
.modal.mid .msheet{border-radius:20px;max-height:80%}
.msheet ul{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14px;line-height:1.45}
.faceid{display:grid;justify-items:center;gap:10px;text-align:center;padding:10px 0}
.faceid .f{width:70px;height:70px;border-radius:20px;border:2.5px solid var(--ink);display:grid;place-items:center;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.toast{position:absolute;left:16px;right:16px;bottom:18px;z-index:30;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.4;animation:up .25s}
.sl{display:grid;gap:8px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--g1);padding:3px;border-radius:10px}
.mode[hidden]{display:none}
.mode button{appearance:none;border:0;background:transparent;border-radius:8px;height:28px;font:700 12px var(--body);color:var(--g3);cursor:pointer}
.mode button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.sc4{grid-template-columns:repeat(4,1fr);margin-top:6px}
.apptb{flex:none;height:52px;display:flex;align-items:center;gap:6px;padding:0 6px;font:700 15px var(--body);border-bottom:1px solid var(--g2)}
.apptb .nwl{width:24px;height:24px;border-radius:7px;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 13px var(--display)}
.apptb .exl{width:24px;height:24px;border-radius:7px;background:#9C9C9C}
.sheet.ex,.sheet.ex .sf{background:#ECECEC}
.sheet.ex .apptb{background:#D8D8D8;border-color:#C9C9C9;color:#333}
.sheet.ex .btn:not(.out):not([disabled]){background:#3D3D3D}
.sheet.ex .item{border-color:#DADADA}
.cpbar{display:flex;justify-content:space-between;gap:8px;background:var(--g1);border-radius:10px;padding:8px 10px;font-size:12px;flex:none}
.cpbar span{color:var(--g3);font-weight:600}
.sheet.ex .cpbar{background:#fff}
.field{border:1px solid var(--g2);background:#fff;border-radius:10px;padding:8px 8px 8px 12px;display:flex;gap:8px;align-items:center}
.field .k{font-size:11px;font-weight:700;color:var(--g3)}
.field .v{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;overflow-wrap:anywhere}
.field .v.ph{font-family:var(--body);color:var(--g3)}
.rowbtn{width:100%;font:inherit;color:inherit;cursor:pointer;text-align:left}
.rowbtn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.modal.switch{flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(20,20,20,.72)}
.apps{display:flex;gap:16px;animation:swl .85s ease-in-out both}
.apps.back{animation-name:swr}
.appc{width:118px;height:210px;border-radius:20px;background:#fff;display:grid;place-items:center;align-content:center;gap:8px;font:700 13px var(--body);color:var(--ink)}
.appc i{width:40px;height:40px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 18px var(--display);font-style:normal}
.appc.exc{background:#E2E2E2}.appc.exc i{background:#9C9C9C}
.swlbl{color:#fff;font-weight:700;font-size:14px}
@keyframes swl{from{transform:translateX(68px)}to{transform:translateX(-68px)}}
@keyframes swr{from{transform:translateX(-68px)}to{transform:translateX(68px)}}
.pill.wrap{white-space:normal;text-align:left}
.risks{margin:0;padding-left:18px;display:grid;gap:8px;font-size:13.5px;line-height:1.45}
.sl .item{align-items:flex-start}
@media (max-width:430px){
  body{padding-block:8px}
  .phone{--w:100%;width:100%;border-radius:36px;border-width:6px;height:calc(100dvh - 16px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="page">

  <div class="phone" id="phone">

      <div class="seg" id="seg" role="tablist" aria-label="Experience level"></div>

</div>

<script>
(function(){

function movers(){
 const c=lvl(),sel=S.d.sel||ORDER.slice();let now=[],later=[];
 ORDER.forEach(k=>{if(!sel.includes(k))return;if(k==='USDC'&&c.hold)later.push(k);else now.push(k)});
 if(S.d.sellZ&&c.opt)now.push('ZORB');
 return {now,later};
}
const allMovers=()=>{const m=movers();return m.now.concat(m.later)};
const TL={slow:{ETH:[0,2,5,8],BTC:[1,4,10,15],SOL:[1,3,7,11],ZORB:[2,4,6,9],USDC:[0,2,4,6]},fast:{BTC:[0,1,3,5],ETH:[0,1,3,4],SOL:[0,1,2,3],USDC:[0,1,3,4],ZORB:[0,1,2,3]}};
function ts(c){
 const cfg=lvl();let t=S.tick;let T;
 if(S.level===11)T=TL.fast[c];
 else if(c==='USDC'&&cfg.hold){if(!S.rel)return {st:'scheduled',idx:0,note:'Likely exchange hold. Estimated ETA ~2 days.'};t=S.tick-S.relT;T=TL.slow.USDC}
 else if(c==='SOL'&&S.level===5&&MODE5==='fail'&&S.d.solFail){if(S.d.solRetryT==null)return {st:'failed',idx:0,note:'Coinbase’s code expired, so SOL never left Coinbase. Nothing was lost.',retry:true};t=S.tick-S.d.solRetryT;T=TL.slow.SOL}
 else T=(cfg.partner?TL.fast:TL.slow)[c];
 const [sb,cf,nm,cr]=T;
 if(t>=cr&&c==='SOL'&&S.level===5&&MODE5==='held')return {st:'held',idx:3,note:'We’re checking SOL before it’s credited. If it can’t be credited, it’s returned to an address you give.'};
 if(t>=cr)return {st:'credited',idx:4,note:'Available in Northwind at '+(c==='USDC'&&cfg.hold?'Sun, Nov 1 · 9:14 AM':C[c].credit)};
 if(t>=nm)return {st:'match',idx:3,note:'Funds stay unavailable until the name matches.'};
 if(t>=cf)return {st:'confirming',idx:2,note:'Waiting for network confirmations.'};
 if(t>=sb)return {st:'submitted',idx:1,note:'Coinbase has the request.'};
 return {st:'pending',idx:0,note:'Starting…'};
}

function qrSVG(seed){
 let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;
 const n=25;let r='';
 const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#1C1C1C"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#1C1C1C"/>`;
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){
  if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16))continue;
  h=(h*1664525+1013904223)>>>0;
  if((h>>>24)&1)r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#1C1C1C"/>`;
 }
 return `<svg viewBox="-1 -1 27 27" width="168" height="168" role="img" aria-label="Example QR code, not scannable" style="display:block;margin:0 auto"><rect x="-1" y="-1" width="27" height="27" fill="#fff"/>${fin(0,0)}${fin(18,0)}${fin(0,18)}${r}</svg>`;
}

 bsign(){S.d.codeFilled=false;go('b-2fa')},
 bfill2fa(){S.d.codeFilled=true;render()},
 bverify(){S.d.sel=ORDER.slice();go('b-choose')},
 selcoin(k,el){const s=S.d.sel;if(el.checked&&!s.includes(k))s.push(k);if(!el.checked)S.d.sel=s.filter(x=>x!==k);render()},
 selall(){S.d.sel=S.d.sel.length===ORDER.length?[]:ORDER.slice();render()},
 sellz(_,el){S.d.sellZ=el.checked;render()},
 basis(){S.d.basisOpen=!S.d.basisOpen;render()},
 statuses(){S.modal={t:'status'};render()},
 bcode(){const s0=S;S.d.codeFilled=true;render();const n=movers().now.length;setTimeout(()=>{if(S!==s0||S.screen!=='b-code')return;const i=(S.d.ci||0)+1;if(i>=n){S.d.ci=0;go('b-track',{nohist:true})}else{S.d.ci=i;S.d.codeFilled=false;render()}},650)},
 bbatch(){const s0=S;S.d.codeFilled=true;render();setTimeout(()=>{if(S!==s0||S.screen!=='b-batch')return;go('b-track',{nohist:true})},750)},
 solskip(){const n=movers().now.length;const i=(S.d.ci||0)+1;if(i>=n){S.d.ci=0;go('b-track',{nohist:true})}else{S.d.ci=i;S.d.codeFilled=false;render()}},
 retrysol(){S.modal={t:'retry'};S.d.rcode=false;render()},
 rfill(){const s0=S;S.d.rcode=true;render();setTimeout(()=>{if(S!==s0)return;S.modal=null;S.d.solRetryT=S.tick;toast('Code accepted. SOL is on its way.');render()},700)},
 solnew(){toast('Concept: this starts a new plan for SOL.')},
 vstart(){const s0=S;S.modal={t:'faceid',txt:'Approve at Coinbase',sub:'One approval for all 4 coins.'};render();setTimeout(()=>{if(S!==s0)return;S.modal=null;S.screen='v-track';S.open=true;S.tick=0;render()},1200)},
 resume(){if(!S.screen)S.screen=startOf(S.level);S.open=true;render()}
};
function approve(){
 if(S.screen!=='b-review'||S.modal||!S.d.ack)return;
 S.modal={t:'faceid'};render();
 setTimeout(()=>{S.modal=null;if(S.screen!=='b-review')return render();S.d.ci=0;S.d.codeFilled=false;S.hist=[];if(lvl().codes)go('b-code',{nohist:true});else if(lvl().partner)go('b-batch',{nohist:true});else go('b-track',{nohist:true})},1300);
}

/* ---------- render ---------- */
function renderSeg(){
 const md=$('#mode');md.hidden=S.level!==1&&S.level!==5;
 if(S.level===5){md.setAttribute('aria-label','Scenario');md.style.gridTemplateColumns='repeat(3,1fr)';md.innerHTML=[['ok','Happy path'],['fail','SOL fails'],['held','SOL held']].map(([k,l])=>`<button data-mode5="${k}" aria-pressed="${MODE5===k}">${l}</button>`).join('')}
 else{md.setAttribute('aria-label','How today works');md.style.gridTemplateColumns='';md.innerHTML=[['cp','Copy-paste'],['auth','With AUTH']].map(([k,l])=>`<button data-mode="${k}" aria-pressed="${MODE1===k}">${l}</button>`).join('')}
 $('#seg').innerHTML=LV.map(v=>`<button role="tab" aria-selected="${v.id===S.level}" aria-label="${LNAME[v.id]}" data-lv="${v.id}"><b>${v.a}</b><span>${v.b}</span></button>`).join('');
}
function renderHost(){
 const L=S.level,c=lvl();const tracking=S.screen&&TRACK.has(S.screen)&&!S.open&&(S.screen==='b-track'||S.screen==='v-track');
 let h=`<div class="hh"><div class="logo" id="logo"><i>N</i>Northwind Invest</div><div class="avatar" aria-label="Maya">M</div></div>`;
 if(tracking){const n=S.screen==='v-track'?4:allMovers().length;h+=`<button class="banner" data-a="resume">${ic('spin',20)}<span class="grow">Moving ${n} coins<small>Tap to see progress. They keep moving.</small></span>${ic('arrow',18)}</button>`}
 const val=S.done?S.done.reduce((a,k)=>a+C[k].usd,0):0;
 h+=`<div class="card"><div class="muted small">Portfolio</div><div class="big">${money(val)}</div>${S.done?S.done.map(k=>`<div class="hold-row"><span>${C[k].n}</span><span class="tabular">${money(C[k].usd)}</span></div>`).join(''):'<div class="small muted" style="margin-top:4px">No crypto here yet.</div>'}</div>`;
 if(!S.done){
  if(L===11)h+=`<div class="found"><div class="row" style="justify-content:space-between">${ic('link',26)}<span class="tag2" style="position:static">Later phase (concept)</span></div><h2 class="h2">Your Coinbase account is linked</h2><p class="small" style="margin:0">BTC, ETH, SOL and USDC · $8,970.00. You’re moving your crypto to your Northwind account. Nothing is sold. Nothing moves until you approve at Coinbase.</p><button class="btn" data-a="vstart">Approve at Coinbase</button></div>`;
  else h+=`<div class="card" style="display:grid;gap:10px"><h2 class="h2">Move crypto you already own</h2><p class="small muted" style="margin:0">${c.kind==='single'?(MODE1==='cp'?'Copy a Northwind address into your exchange, one coin at a time.':'Move coins from your exchange, one at a time.'):c.kind==='sell'?'Sell at your exchange, then move the cash in one transfer.':'Move several coins from your exchange in one go.'} ${c.kind==='bulk'&&!c.partner?'Nothing moves until you approve your plan.':'Nothing moves until you approve at your exchange.'}</p>${c.kind==='bulk'?btn('Move all my crypto','resume'):S.screen?btn('Resume','resume'):btn('Start a move','resume')}</div>`;
 }else h+=`<div class="note ok">${ic('check',20)}<div><b>Moved from Coinbase</b>${S.level===1?(MODE1==='cp'?'Four separate copy-paste sends from your exchange.':'Four transfers. USDC counted as landed after the hold.'):'Your coins are here and ready to use.'}</div></div>`;
 h+=FOOT;
 $('#host').innerHTML=h;
}
function renderSheet(){
 const sh=$('#sheet');sh.classList.toggle('open',S.open&&!!S.screen);
 if(!S.screen){sh.innerHTML='';return}
 const sb=sh.querySelector('#sb');const keep=(S.seen===S.screen&&sb)?sb.scrollTop:0;
 const m=SCR[S.screen]();sh.classList.toggle('ex',m.chrome==='ex');
 sh.innerHTML=page(m);
 const nsb=sh.querySelector('#sb');if(nsb)nsb.scrollTop=keep;S.seen=S.screen;
 if(S.screen==='b-review')bindSlide();
}
function renderModal(){
 const l=$('#layer');const old=l.querySelector('.modal');
 if(!S.modal){if(old)old.remove();return}const t=S.modal.t;let h='',cls='';
 if(t==='manual'){cls='mid';h=`<div class="msheet" role="alertdialog" aria-label="Deposit manually">${NOTE('warn','alert','A manual send can go wrong','Check every risk before you continue.')}<ul class="risks"><li><b>Wrong network:</b> the coins are lost and can’t be returned.</li><li><b>Missing memo or tag:</b> some coins need one. Without it, Northwind can’t match the deposit to you.</li><li><b>Below the minimum:</b> amounts under the deposit minimum aren’t credited.</li><li><b>Held for review:</b> sends started outside AUTH can be held until Northwind support releases them or returns them to an address you give.</li></ul><p class="small muted" style="margin:0">Use manual deposit only if you can’t link your account. Linking is the safe way to move crypto.</p>${btn('Go back and link my account','mclose')}<button class="btn out sm" data-a="manaddr">${ic('qr',16)} I understand, show the address</button></div>`}
 if(t==='before'){const k=cpk(),d=CP[k];h=`<div class="msheet" role="dialog" aria-label="Before you send"><h2 class="h2">Before you send ${k}</h2><ul class="risks"><li><b>Only send ${k} on ${d.ok}.</b> ${k} sent on any other network is lost.</li><li><b>Minimum deposit: ${d.min}.</b> Less than that isn’t credited.</li><li><b>Include the memo tag.</b> Without it, Northwind can’t match the deposit to you.</li><li><b>Send a test amount first.</b> Send the rest once it arrives.</li></ul>${btn('I understand','cpbefore')}</div>`}
 if(t==='switch'){cls='switch';const toEx=S.modal.to==='Exchange';h=`<div class="apps${toEx?'':' back'}" aria-hidden="true"><div class="appc"><i>N</i>Northwind</div><div class="appc exc"><i></i>Exchange</div></div><div class="swlbl" role="status">Switching to ${S.modal.to}</div>`}
 if(t==='faceid'){cls='mid';h=`<div class="msheet"><div class="faceid"><div class="f">${ic('face',40,1.6)}</div><div class="h2">${S.modal.txt||'Approve with Face ID'}</div><div class="small muted">${S.modal.sub||'Approving once for the whole plan.'}</div></div></div>`}
 if(t==='retry'){h=`<div class="msheet" role="dialog" aria-label="Retry SOL"><div class="row"><h2 class="h2 grow">Enter Coinbase’s code to send SOL</h2><button class="ib" data-a="mclose" aria-label="Close">${ic('x')}</button></div><p class="small muted" style="margin:0">Coinbase sent a new code to your phone ending in 42. Your other coins keep moving.</p>${codeBoxes(!!S.d.rcode)}${!S.d.rcode?`<button class="autofill" data-a="rfill">${ic('send',16)} <span>From Messages <small>552 104</small></span></button>`:`<div class="center">${pill('credited','Code accepted')}</div>`}</div>`}
 if(t==='status'){h=`<div class="msheet" role="dialog" aria-label="Transfer statuses"><div class="row"><h2 class="h2 grow">What each status means</h2><button class="ib" data-a="mclose" aria-label="Close">${ic('x')}</button></div><p class="small muted" style="margin:0">A submitted transfer is not a completed one. Coins are credited only once Northwind confirms funds are available.</p><div class="sl">${STATUS_HELP.map(([k,m])=>`<div class="item" style="display:block">${pill(k)}<div class="small" style="margin-top:6px">${m}</div></div>`).join('')}</div></div>`}
 if(old&&old._h===h)return;if(old)old.remove();
 const d=document.createElement('div');d.className='modal '+cls;d.innerHTML=h;d._h=h;
 if(t!=='faceid'&&t!=='switch')d.addEventListener('click',e=>{if(e.target===d){S.modal=null;render()}});
 l.appendChild(d);
}
function render(){renderSeg();renderHost();renderSheet();renderModal()}
A.mclose=()=>{S.modal=null;render()};

/* ---------- events ---------- */
$('#phone').addEventListener('click',e=>{
 const lv=e.target.closest('[data-lv]');if(lv){setLevel(+lv.dataset.lv);return}
 const md=e.target.closest('[data-mode]');if(md){MODE1=md.dataset.mode;setLevel(1);return}
 const m5=e.target.closest('[data-mode5]');if(m5){MODE5=m5.dataset.mode5;setLevel(5);return}
 const el=e.target.closest('[data-a]');if(!el)return; const f=A[el.dataset.a];if(f)f(el.dataset.arg,el,e);
});
$('#phone').addEventListener('input',e=>{
 if(e.target.id==='q2'){const q=e.target.value.trim().toLowerCase();document.querySelectorAll('#coins .rowbtn').forEach(t=>{t.hidden=!!q&&!t.dataset.name.includes(q)})}
 if(e.target.id==='q'){const q=e.target.value.trim().toLowerCase();document.querySelectorAll('#tiles .tile').forEach(t=>{t.hidden=!!q&&!t.dataset.name.includes(q)})}
});
/* swipe on the control */
let sx=null;const strip=$('#strip');
strip.addEventListener('pointerdown',e=>{sx=e.clientX});
strip.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>45)shift(dx<0?1:-1)});
strip.addEventListener('pointercancel',()=>{sx=null});
document.addEventListener('keydown',e=>{
 if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
 if(e.key==='ArrowRight')shift(1);if(e.key==='ArrowLeft')shift(-1);
});
window.addEventListener('hashchange',()=>{const m=/^#star-(\d+)$/.exec(location.hash);if(m&&CFG[+m[1]]&&+m[1]!==S.level)setLevel(+m[1])});

function bindSlide(){
 const sl=$('#slide'),kn=$('#knob'),fl=$('#sfill');if(!sl)return;
 let x0=null,max=0;
 const set=x=>{kn.style.transform=`translateX(${x}px)`;fl.style.width=(x+50)+'px'};
 kn.addEventListener('pointerdown',e=>{x0=e.clientX;max=sl.clientWidth-54;kn.setPointerCapture(e.pointerId)});
 kn.addEventListener('pointermove',e=>{if(x0==null)return;set(Math.max(0,Math.min(max,e.clientX-x0)))});
 const end=e=>{if(x0==null)return;const x=Math.max(0,Math.min(max,e.clientX-x0));x0=null;if(x>=max*.85){set(max);approve()}else{kn.style.transition='transform .2s';set(0);setTimeout(()=>kn.style.transition='',220)}};
 kn.addEventListener('pointerup',end);kn.addEventListener('pointercancel',()=>{x0=null;set(0)});
 sl.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();set(sl.clientWidth-54);approve()}});
}
/* clock: one deterministic tick per second on waiting screens */
setInterval(()=>{
 if(!TRACK.has(S.screen))return;
 S.tick++;
 /* the 2-day exchange hold ends by itself a few seconds after the other coins land */
 if(S.screen==='b-track'&&lvl().hold&&!S.rel&&allMovers().includes('USDC')&&allMovers().filter(c=>c!=='USDC').every(c=>isFinal(ts(c).st))){S.wait=(S.wait||0)+1;if(S.wait>=7){S.rel=true;S.relT=S.tick;toast('Two days later: Coinbase released the USDC hold.')}}
 if(S.screen==='v-track'&&allMovers().every(c=>ts(c).st==='credited')){S.screen='v-success';S.seen=null}
 if(S.open||S.screen==='b-track'||S.screen==='v-track')render();
},1000);
/* two-finger long press on the logo is reserved for a later scenarios sheet */

const m0=/^#star-(\d+)$/.exec(location.hash);
setLevel(m0&&CFG[+m0[1]]?+m0[1]:5);
})();
</script>
